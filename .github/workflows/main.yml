name: CI/CD - API REST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests y Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore WebApp.Tests/WebApp.Tests.csproj

      - name: Ejecutar pruebas con coverage
        run: |
          dotnet test WebApp.Tests/WebApp.Tests.csproj \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings

      - name: Mostrar coverage
        run: |
          echo "===== RESULTADO DE COVERAGE ====="
          grep -o 'line-rate="[^"]*"' \
            WebApp.Tests/TestResults/*/coverage.cobertura.xml | head -1

  docker:
    name: Build y Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            monteswastaken/practica-devops-api:latest
            monteswastaken/practica-devops-api:sha-${{ github.sha }}

  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Actualizar contenedor en EC2
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} << 'COMANDOS'
            set -e
            docker pull monteswastaken/practica-devops-api:latest
            docker rm -f practica-devops-api || true
            docker run -d --name practica-devops-api \
              --restart unless-stopped \
              -p 80:5172 -p 6061:6061 \
              -v practica-devops-data:/app/data \
              monteswastaken/practica-devops-api:latest
            docker image prune -f
          COMANDOS

      - name: Comprobar que la API responde
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://${{ secrets.EC2_HOST }}/api/productos; then
              echo ""
              echo "API desplegada correctamente"
              exit 0
            fi
            sleep 5
          done
          echo "La API no respondió después del despliegue"
          exit 1
