name: CI/CD - API REST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests y Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore WebApp.Tests/WebApp.Tests.csproj

      - name: Ejecutar pruebas con coverage
        run: |
          dotnet test WebApp.Tests/WebApp.Tests.csproj \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings

      - name: Generar resumen de coverage
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"WebApp.Tests/TestResults/*/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"TextSummary;MarkdownSummaryGithub;Html"
          echo "===== RESUMEN DE COVERAGE ====="
          cat coverage-report/Summary.txt
          cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Verificar umbral mínimo de coverage (70%)
        run: |
          RATE=$(grep -o -m1 'line-rate="[^"]*"' WebApp.Tests/TestResults/*/coverage.cobertura.xml | head -1 | cut -d'"' -f2)
          PORCENTAJE=$(awk "BEGIN { printf \"%.2f\", $RATE * 100 }")
          echo "Cobertura de líneas: $PORCENTAJE% (mínimo requerido: 70%)"
          if awk "BEGIN { exit !($PORCENTAJE < 70) }"; then
            echo "::error::La cobertura ($PORCENTAJE%) es menor al 70%"
            exit 1
          fi
          echo "Cobertura aprobada"

      - name: Guardar reporte de coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

  docker:
    name: Build y Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/practica-devops-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/practica-devops-api:${{ github.sha }}

  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Actualizar contenedor en EC2
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} << 'COMANDOS'
            set -e
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/practica-devops-api:latest
            docker rm -f practica-devops-api || true
            docker run -d --name practica-devops-api \
              --restart unless-stopped \
              -p 80:5172 -p 6061:6061 \
              -v practica-devops-data:/app/data \
              ${{ secrets.DOCKERHUB_USERNAME }}/practica-devops-api:latest
            docker image prune -f
          COMANDOS

      - name: Comprobar que la API responde
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://${{ secrets.EC2_HOST }}/api/health; then
              echo ""
              echo "API desplegada correctamente"
              exit 0
            fi
            sleep 5
          done
          echo "La API no respondió después del despliegue"
          exit 1
